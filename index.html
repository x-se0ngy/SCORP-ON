<script>

const W = 393, H = 852;
const EASE = {
  io: 'cubic-bezier(.42,0,.58,1)',
  slow: 'cubic-bezier(.22,.8,.3,1)',
};
const stage = document.getElementById('stage');
const holder = document.getElementById('holder');

/* ---------- scaling ---------- */
function fit() {
  const availW = Math.max(100, window.innerWidth - 32);
  const s = Math.min(availW / W, window.innerHeight * 0.96 / H);
  stage.style.transform = `scale(${s})`;
  holder.style.width = (W * s) + 'px';
  holder.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---------- helpers ---------- */
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const img = (src, x, y, extra = '') => `<img src="img3/${src}" alt="" style="left:${x}px;top:${y}px;${extra}">`;
const patch = (x, y, w, h, inner, cls = '') =>
  `<div class="patch ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="fc" style="left:${-x}px;top:${-y}px">${inner}</div></div>`;

/* ---------- screens ---------- */
const S = {};
let current = null, busy = false;
const timers = new Set();
const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; };
const clearTimers = () => { timers.forEach(clearTimeout); timers.clear(); };
const rafs = new Set();

function makeScreen(id, base) {
  const s = el(`<section class="screen" data-id="${id}">${base ? `<img class="base" src="img3/${base}" alt="" style="left:0;top:0;width:393px;height:852px">` : ''}</section>`);
  stage.appendChild(s);
  S[id] = { el: s, hs: [], auto: null, enter: null };
  return S[id];
}
function hotspot(scr, x, y, w, h, to, dur = 400, ease = EASE.io, label = '') {
  const b = el(`<button class="hs" type="button" aria-label="${label || to}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></button>`);
  b.addEventListener('click', () => go(to, dur, ease));
  (scr.layer || scr.el).appendChild(b);
}

const GO_HOOKS = [];
function go(to, dur = 400, ease = EASE.io, isBack = false) {
  if (busy || !S[to] || (current && current.id === to)) return;
  busy = true;
  clearTimers();
  GO_HOOKS.forEach(f => f(to));
  const prev = current;
  const next = S[to];
  next.id = to;
  if (!isBack && prev) next.from = prev.id;
  next.el.classList.add('on');
  next.el.style.transition = 'none';
  next.el.style.opacity = dur ? 0 : 1;
  next.el.style.zIndex = 2;
  if (prev) prev.el.style.zIndex = 1;
  if (next.enter) next.enter();
  void next.el.offsetWidth;
  const done = () => {
    if (prev) { prev.el.classList.remove('on'); prev.el.style.zIndex = ''; if (prev.leave) prev.leave(); }
    next.el.style.zIndex = '';
    current = next; busy = false;
    if (next.start) next.start();
    if (next.auto) later(() => go(next.auto.to, next.auto.dur, next.auto.ease), next.auto.after);
  };
  if (!dur) { done(); return; }
  next.el.style.transition = `opacity ${dur}ms ${ease}`;
  next.el.style.opacity = 1;
  later(done, dur + 20);
}

/* keep rebuilt text within the width it has in Figma */
function fitText(root) {
  root.querySelectorAll('[data-w]').forEach(e => {
    e.style.transform = '';
    const w = +e.dataset.w, sw = e.scrollWidth;
    if (sw > w + 0.5) { e.style.transformOrigin = '0 50%'; e.style.transform = `scaleX(${w / sw})`; }
  });
}

/* =========================================================
   scroll helper (wheel + drag with momentum)
   ========================================================= */
function makeScroller(sc) {
  let dragging = false, moved = false, lastY = 0, lastT = 0, vel = 0, raf = null, pid = null;
  const scale = () => stage.getBoundingClientRect().height / H;
  sc.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.pointerType !== 'mouse') return;
    dragging = true; moved = false; lastY = e.clientY; lastT = performance.now(); vel = 0; pid = e.pointerId;
    cancelAnimationFrame(raf);
  });
  window.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== pid) return;
    const dy = (e.clientY - lastY) / scale();
    if (!moved && Math.abs(dy) > 3) { moved = true; sc.classList.add('drag'); try { sc.setPointerCapture(pid); } catch (_) {} }
    if (!moved) return;
    const now = performance.now();
    sc.scrollTop -= dy;
    vel = -dy / Math.max(1, now - lastT) * 16;
    lastY = e.clientY; lastT = now;
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; sc.classList.remove('drag');
    if (moved) {
      const glide = () => { vel *= 0.94; sc.scrollTop += vel; if (Math.abs(vel) > 0.3) raf = requestAnimationFrame(glide); };
      raf = requestAnimationFrame(glide);
    }
  };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  sc.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

/* drag-to-scroll for mouse, with an axis lock so card swipes don't scroll */
function dragScroll(sc) {
  let on = false, moved = false, sx = 0, sy = 0, ly = 0, lt = 0, vel = 0, raf = null, pid = null;
  sc.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.pointerType !== 'mouse') return;
    on = true; moved = false; sx = e.clientX; sy = ly = e.clientY; lt = performance.now(); vel = 0; pid = e.pointerId;
    cancelAnimationFrame(raf);
  });
  window.addEventListener('pointermove', e => {
    if (!on || e.pointerId !== pid || sc.__lock) return;
    const k = stageScale();
    if (!moved) {
      const dx = (e.clientX - sx) / k, dy = (e.clientY - sy) / k;
      if (Math.abs(dy) > 6 && Math.abs(dy) > Math.abs(dx)) { moved = true; sc.classList.add('drag'); } else return;
    }
    const now = performance.now(), dy = (e.clientY - ly) / k;
    sc.scrollTop -= dy; vel = -dy / Math.max(1, now - lt) * 16; ly = e.clientY; lt = now;
  });
  const end = () => {
    if (!on) return; on = false; sc.classList.remove('drag');
    if (moved) { const glide = () => { vel *= .94; sc.scrollTop += vel; if (Math.abs(vel) > .3) raf = requestAnimationFrame(glide); }; raf = requestAnimationFrame(glide); }
  };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  sc.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

{

  const EMPTY = { all: '알림이 없어요', sos: '긴급 알림이 없어요', detect: '감지 알림이 없어요', system: '시스템 알림이 없어요' };

    chips.innerHTML = CAT_LB.map(([k, lb]) => `<button type="button" class="x-chip${k === filter ? ' on' : ''}" data-k="${k}">${lb}<em>${ST.notifs.filter(CAT[k]).length}</em></button>`).join('');

    const now = appNow(), groups = [['오늘', []], ['지난 7일', []], ['이전', []]];
    items.forEach(n => groups[sameDay(n.at, now) ? 0 : now - n.at < 7 * 864e5 ? 1 : 2][1].push(n));
    list.innerHTML = groups.filter(g => g[1].length).map(([lb, ns]) => `<div class="x-sec">${lb}</div>` + ns.map(n => `

    list.querySelectorAll('.x-nwrap').forEach(bindCard);
  };
  const remove = (id) => {
    const i = ST.notifs.findIndex(n => n.id === id); if (i < 0) return;
    const [n] = ST.notifs.splice(i, 1);
    render(); refreshBadges();
    toast('알림을 삭제했어요', { label: '실행 취소', on: () => { ST.notifs.splice(i, 0, n); render(); refreshBadges(); } });
  };
  let openWrap = null;
  const closeOpen = () => { if (openWrap) { const c = openWrap.querySelector('.x-ncard'); c.style.transition = 'transform .22s ease'; c.style.transform = ''; openWrap = null; } };
  function bindCard(wrap) {
    const card = wrap.querySelector('.x-ncard'), id = wrap.dataset.id;
    let sx = null, sy = 0, dx = 0, base = 0, mode = null, pid = null, swiped = false;
    card.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      sx = e.clientX; sy = e.clientY; mode = null; pid = e.pointerId; swiped = false;
      base = openWrap === wrap ? -84 : 0; dx = base; card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e => {
      if (sx === null || e.pointerId !== pid) return;
      const k = stageScale(), ddx = (e.clientX - sx) / k, ddy = (e.clientY - sy) / k;
      if (!mode) {
        if (Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy)) { mode = 'h'; sc.__lock = true; try { card.setPointerCapture(pid); } catch (_) {} if (openWrap && openWrap !== wrap) closeOpen(); }
        else if (Math.abs(ddy) > 8) mode = 'v';

    const end = () => {
      if (sx === null) return; sx = null; sc.__lock = false;
      if (mode !== 'h') return;
      swiped = true;
      card.style.transition = 'transform .22s ease';
      if (dx < -130) { card.style.transform = 'translateX(-105%)'; setTimeout(() => remove(id), 180); }

      else { card.style.transform = ''; if (openWrap === wrap) openWrap = null; }
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
    card.addEventListener('click', () => {
      if (swiped) { swiped = false; return; }
      if (openWrap) { closeOpen(); return; }
      const n = ST.notifs.find(x => x.id === id); if (!n) return;
      if (!n.read) { n.read = true; refreshBadges(); }

          ], cancel: '취소' });

  });

  s.enter = () => { openWrap = null; render(); sc.scrollTop = 0; };
}

  ];

    <button class="x-cbtn round b1" type="button" style="left:95px;top:391px"></button>

    <button class="x-cbtn round b3" type="button" style="left:250px;top:391px"></button>
    <div class="x-tlhead" style="top:470px"><span class="tt">Timeline</span><button type="button" class="fchip" hidden></button><button type="button" class="x-ib filt" aria-label="필터">${I.filter}</button></div>
    <div class="x-scroll" style="top:512px;bottom:0"><div class="list" style="padding-bottom:130px"></div></div>
    <div class="x-fade-b"></div><div class="homebar"></div>`);
  const $ = q => s.el.querySelector(q);
  const img = $('.x-vid img'), grain = $('.x-grain'), gctx = grain.getContext('2d');
  const tlRd = $('.x-pb-tl .rd'), tlLb = $('.x-pb-tl .lb'), ts = $('.x-pb-ts'), q = $('.q'), goLive = $('.golive'), big = $('.x-pb-big');
  const scrub = $('.x-scrub'), lblL = $('.x-scrub .l'), lblR = $('.x-scrub .r'), bar = $('.x-scrub .bar'), fillEl = $('.x-scrub .fill'), knob = $('.x-scrub .knob');
  const b1 = $('.b1'), b2 = $('.b2'), b3 = $('.b3');
  const list = $('.list'), sc = $('.x-scroll'), fchip = $('.fchip');
  dragScroll(sc);
  const clip = () => clipById(R.clipId);
  const fmtStamp = ms => { const d = new Date(ms); return `${fmtDate(ms).replace(/\./g, '-')} · ${fmtTime(ms)}:${pad(d.getSeconds())}`; };

  const renderControls = () => {
    const live = R.mode === 'live';
    scrub.classList.toggle('live', live);
    q.hidden = !live; goLive.hidden = live;
    if (live) {
      b1.innerHTML = I.cam; b1.setAttribute('aria-label', '스냅샷');
      b2.innerHTML = R.on ? I.stop : I.recDot; b2.setAttribute('aria-label', R.on ? '녹화 정지' : '녹화 시작');
      b3.innerHTML = R.mic ? I.mic : I.micOff; b3.setAttribute('aria-label', R.mic ? '음성 녹음 끄기' : '음성 녹음 켜기');
      b3.classList.toggle('off', !R.mic); b1.classList.remove('off');
      q.textContent = R.quality;
    } else {
      b1.innerHTML = I.back10; b1.setAttribute('aria-label', '10초 뒤로');
      b3.innerHTML = I.fwd10; b3.setAttribute('aria-label', '10초 앞으로'); b3.classList.remove('off');
      const ended = R.t >= clip().dur;
      b2.innerHTML = R.playing ? I.pause : ended ? I.replay : I.play; b2.setAttribute('aria-label', R.playing ? '일시정지' : '재생');
    }
    big.classList.toggle('show', !live && R.t >= (clip() || { dur: 1 }).dur && !R.playing);
    const v = live ? { f: 'none', flip: false } : vf(clip().v);
    img.style.filter = v.f;
  };
  const renderList = () => {
    const items = ST.clips.filter(c => R.filter === 'all' || c.type === R.filter).sort((a, b) => b.at - a.at);
    fchip.hidden = R.filter === 'all';
    fchip.innerHTML = `${(FILTERS.find(f => f[0] === R.filter) || [])[1] || ''}${I.x}`;
    if (!items.length) { list.innerHTML = `<div class="x-empty" style="padding-top:30px"><b>해당하는 영상이 없어요</b><span>필터를 바꾸거나 위에서 바로 녹화해 보세요</span></div>`; return; }
    let lastDay = '', h = '';
    items.forEach(c => {
      const dk = dayKey(c.at);
      if (dk !== lastDay) { lastDay = dk; h += `<div class="x-sec" style="padding-top:${h ? 14 : 4}px">${dayLabel(c.at)}</div>`; }
      const v = vf(c.v), selc = R.mode === 'play' && R.clipId === c.id;
      h += `<button type="button" class="x-clip${selc ? ' sel' : ''}" data-id="${c.id}">
        <span class="th"><img src="img3/l120_cam.png" alt="" style="filter:${v.f};${v.flip ? 'transform:scaleX(-1);' : ''}object-position:${50 + v.x * 3}% 50%"><em>${mmss(c.dur)}</em></span>
        <span><span class="t1">${c.label}${c.lock ? `<span style="color:var(--x-dim);display:inline-grid" aria-label="보호됨">${I.lock}</span>` : ''}${selc ? `<span class="x-eq${R.playing ? '' : ' pause'}"><i></i><i></i><i></i></span>` : ''}</span><span class="t2" style="display:block">${fmtTime(c.at)} · ${c.size}MB</span></span>
        <span class="x-tag${c.type === 'SOS' ? ' sos' : ' ghost'}">${c.type}</span>
      </button>`;
    });
    list.innerHTML = h;
    list.querySelectorAll('.x-clip').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.id;
      if (R.mode === 'play' && R.clipId === id) { togglePlay(); return; }
      R.mode = 'play'; R.clipId = id; R.t = 0; R.playing = true; renderAll();
    }));
  };
  const renderAll = () => { if (R.mode === 'play' && !clip()) R.mode = 'live'; renderControls(); renderList(); paintFrame(true); };
  s.render = renderAll;

  const togglePlay = () => {
    const c = clip(); if (!c) return;
    if (R.t >= c.dur) R.t = 0;
    R.playing = !R.playing; renderControls(); renderList();
  };
  const seek = sec => { const c = clip(); if (!c) return; R.t = Math.max(0, Math.min(c.dur, sec)); renderControls(); paintFrame(true); };

  b1.addEventListener('click', () => {
    if (R.mode === 'live') { const f = $('.x-flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); toast('스냅샷을 사진첩에 저장했어요'); }
    else seek(R.t - 10);
  });
  b3.addEventListener('click', () => {
    if (R.mode === 'live') { R.mic = !R.mic; renderControls(); toast(R.mic ? '주변 음성 녹음을 켰어요' : '주변 음성 녹음을 껐어요 · 영상만 저장돼요'); }
    else seek(R.t + 10);
  });
  b2.addEventListener('click', () => {
    if (R.mode !== 'live') return togglePlay();
    if (R.on) {
      const dur = Math.round((appNow() - R.recStart) / 1000);
      R.on = false;
      if (dur >= 1) {
        const id = 'm' + Date.now();
        ST.clips.unshift({ id, at: R.recStart, dur, type: 'MANUAL', label: '수동 녹화', size: Math.max(1, Math.round(dur * .46)), v: Math.floor(Math.random() * 4) });
        renderAll();
        toast(`녹화를 저장했어요 · ${mmss(dur)}`, { label: '보기', on: () => openClip(id) });
      } else renderAll();
    } else {
      R.on = true; R.recStart = appNow(); renderAll(); toast('녹화를 시작했어요');
    }
  });
  goLive.addEventListener('click', () => { R.mode = 'live'; R.playing = false; renderAll(); });
  big.addEventListener('click', () => { R.t = 0; R.playing = true; renderAll(); });
  $('.filt').addEventListener('click', () => actionSheet({
    title: '영상 필터', items: FILTERS.map(([k, lb]) => ({ label: lb, sub: `${k === 'all' ? ST.clips.length : ST.clips.filter(c => c.type === k).length}개`, checked: R.filter === k, on: () => { R.filter = k; renderList(); sc.scrollTop = 0; } })),
  }));
  fchip.addEventListener('click', () => { R.filter = 'all'; renderList(); });

  // scrubbing
  let scrubbing = false, wasPlaying = false;
  const seekFromEvent = e => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * clip().dur); };
  bar.addEventListener('pointerdown', e => { if (R.mode !== 'play') return; scrubbing = true; wasPlaying = R.playing; R.playing = false; try { bar.setPointerCapture(e.pointerId); } catch (_) {} seekFromEvent(e); });
  bar.addEventListener('pointermove', e => { if (scrubbing) seekFromEvent(e); });
  const endScrub = () => { if (!scrubbing) return; scrubbing = false; if (wasPlaying && R.t < clip().dur) R.playing = true; renderControls(); renderList(); };
  bar.addEventListener('pointerup', endScrub); bar.addEventListener('pointercancel', endScrub);
  bar.addEventListener('keydown', e => { if (R.mode !== 'play') return; if (e.key === 'ArrowRight') seek(R.t + 5); if (e.key === 'ArrowLeft') seek(R.t - 5); });

  // ⋮ menu
  $('.x-more').addEventListener('click', () => {
    if (R.mode === 'live') return actionSheet({ title: '실시간 녹화', items: [
      { label: `화질 · ${R.quality}`, sub: `탭하면 ${R.quality === '4K' ? '1080p' : '4K'}로 바꿔요`, on: () => { R.quality = R.quality === '4K' ? '1080p' : '4K'; renderControls(); toast(`화질을 ${R.quality}로 바꿨어요`); } },
      { label: '녹화 설정', sub: '자동 녹화 · 클라우드 업로드', on: () => go('s124') },
    ] });
    const c = clip();
    actionSheet({ title: c.label, sub: `${fmtFull(c.at)} · ${mmss(c.dur)} · ${c.size}MB`, items: [
      { label: '공유 링크 복사', on: () => {
        const txt = `SCORP-ON 영상 · ${fmtFull(c.at)} · ${c.label}`;
        const ok = () => toast('공유 링크를 복사했어요');
        try { navigator.clipboard.writeText(txt).then(ok, () => toast('복사하지 못했어요. 다시 시도해 주세요')); } catch (_) { toast('복사하지 못했어요. 다시 시도해 주세요'); }
      } },
      { label: '휴대폰에 저장', on: () => toast('휴대폰 사진첩에 저장했어요') },
      { label: c.lock ? '보호 해제' : '영상 보호', sub: c.lock ? '자동 정리 대상에 다시 포함돼요' : '저장 공간이 부족해도 지워지지 않아요', on: () => { c.lock = !c.lock; renderList(); toast(c.lock ? '영상을 보호했어요' : '보호를 해제했어요'); } },
      { label: '삭제', danger: true, on: () => {
        if (c.lock) return toast('보호된 영상이에요. 보호를 해제한 뒤 삭제하세요');
        actionSheet({ title: '이 영상을 삭제할까요?', sub: '클라우드에 올라간 사본도 함께 지워져요.', cancel: '취소', items: [
          { label: '삭제', danger: true, on: () => {
            const i = ST.clips.indexOf(c); ST.clips.splice(i, 1); R.mode = 'live'; R.playing = false; renderAll();
            toast('영상을 삭제했어요', { label: '실행 취소', on: () => { ST.clips.splice(i, 0, c); renderAll(); } });
          } },
        ] });
      } },
    ] });
  });
  $('.x-back').addEventListener('click', () => back('s126'));

  // frame loop: timecode, scrubber, fake motion + film grain
  let raf = null, last = 0, gT = 0;
  const noise = gctx.createImageData(118, 67);
  const paintFrame = force => {
    const live = R.mode === 'live', c = clip();
    if (live) {
      const el2 = R.on ? (appNow() - R.recStart) / 1000 : 0;
      tlRd.className = 'rd' + (R.on ? ' blink' : ' off');
      tlLb.textContent = R.on ? `REC ${mmss(el2)}` : 'STANDBY';
      ts.textContent = fmtStamp(appNow());
      lblL.innerHTML = `<span class="live"><i class="x-live-dot" style="width:6px;height:6px"></i>LIVE</span>`;
      lblR.textContent = R.on ? mmss(el2) : '--:--';
      const k = performance.now() / 1000;
      img.style.transform = `translate(${Math.sin(k * .7) * 1.4}px, ${Math.cos(k * .9) * 1}px) scale(1.03)`;
    } else if (c) {
      tlRd.className = 'rd off';
      tlLb.textContent = R.playing ? `PLAY · ${c.type}` : (R.t >= c.dur ? 'END' : 'PAUSED');
      ts.textContent = fmtStamp(c.at + R.t * 1000);
      lblL.textContent = mmss(R.t); lblR.textContent = mmss(c.dur);
      const p = c.dur ? R.t / c.dur : 0, v = vf(c.v);
      fillEl.style.width = `${p * 100}%`; knob.style.left = `${p * 100}%`;
      bar.setAttribute('aria-valuenow', Math.round(R.t)); bar.setAttribute('aria-valuemax', c.dur);
      img.style.transform = `translateX(${v.x - p * 14}px) scale(${1.04 + p * .05})${v.flip ? ' scaleX(-1)' : ''}`;
    }
  };
  const loop = now => {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    const c = clip();
    if (R.mode === 'play' && R.playing && c) {
      R.t += dt;
      if (R.t >= c.dur) { R.t = c.dur; R.playing = false; renderControls(); renderList(); }
    }
    paintFrame();
    const moving = R.mode === 'live' || R.playing;
    if (moving && now - gT > 70) {
      gT = now;
      const d = noise.data;
      for (let i = 0; i < d.length; i += 4) { const g = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = Math.random() * 34; }
      gctx.putImageData(noise, 0, 0);
    }
    raf = requestAnimationFrame(loop);
  };
  s.enter = () => { renderAll(); sc.scrollTop = 0; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); };
  s.leave = () => { cancelAnimationFrame(raf); if (R.mode === 'play') R.playing = false; };
}

/* ---------- boot ---------- */
['s1','s2','s3','s126','s127_clean','s124_content','s124_top','s124_bot',
 'l2_vector','l2_scanning','l120_cam','l126_logo','l126_glow','r_wedge','r_dots','glyph']
  .forEach(n => { const i = new Image(); i.src = `img3/${n}.png`; });
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    busy = false; clearTimers();
    if (current) { current.el.classList.remove('on'); current = null; }
    go('s2', 0);
  }
});
go('s2', 0);
window.__proto = { go, get current() { return current && current.id; } };
})();
</script>
